<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lekibbitz Bridge">
  <!-- Marine card background, lekibbitz-bridge identity -->
  <rect width="64" height="64" rx="14" fill="#1f3a5f"/>
  <!-- Subtle inner glow -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- The four family suits of Petit Bridge: rouge / jaune / vert / bleu -->
  <circle cx="22" cy="22" r="9" fill="#ff6b6b"/>
  <circle cx="42" cy="22" r="9" fill="#ffc83d"/>
  <circle cx="22" cy="42" r="9" fill="#7bc96f"/>
  <circle cx="42" cy="42" r="9" fill="#4a90ff"/>
</svg>
